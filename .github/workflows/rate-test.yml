name: rate-test

# One-off experiment: do parallel jobs (separate runners, separate IPs) each get Apple's ~20 calls/min,
# or do they share one limit? Each job runs at the pace one runner sustains (3.4 s) for a few minutes.
# Read the answer in the run's summary: zero throttles in every job = the limit is per IP.
on:
  workflow_dispatch:
    inputs:
      interval_ms:
        description: 'milliseconds between requests in each job'
        default: '3400'
      minutes:
        description: 'how long each job runs'
        default: '5'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node tools/rate-test.mjs ${{ matrix.shard }} 3 ${{ inputs.interval_ms || '3400' }} ${{ inputs.minutes || '5' }}
